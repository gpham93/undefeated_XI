<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undefeated XI</title>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          background-color: #05070A;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
        }
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
        }
        .stadium-ring {
          position: relative;
          width: 70px;
          height: 70px;
          border-radius: 50%;
          border: 3px solid rgba(6, 182, 212, 0.05);
          border-top-color: #06b6d4;
          border-bottom-color: #10b981;
          animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        .stadium-ring::after {
          content: '';
          position: absolute;
          inset: 6px;
          border-radius: 50%;
          border: 2px dashed rgba(6, 182, 212, 0.2);
          animation: spin-reverse 8s linear infinite;
        }
        .loader-logo {
          font-family: sans-serif;
          font-size: 15px;
          font-weight: 900;
          letter-spacing: 0.25em;
          color: #ffffff;
          text-transform: uppercase;
          text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
          animation: pulse 1.5s ease-in-out infinite;
        }
        .loader-subtitle {
          font-family: sans-serif;
          font-size: 9px;
          text-transform: uppercase;
          letter-spacing: 0.3em;
          color: #06b6d4;
          font-weight: bold;
          margin-top: -12px;
          opacity: 0.8;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      </style>
      <div class="app-loader">
        <div class="stadium-ring"></div>
        <div class="loader-logo">Undefeated XI</div>
        <div class="loader-subtitle">Loading Arena...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
